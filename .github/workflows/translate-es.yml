name: i18n-auto-translate-es

on:
  workflow_dispatch:
  push:
    paths:
      - "models/darwin-vs-kropotkin/index.md"
      - "models/darwin-vs-kropotkin/lab/i18n/en.json"
      - "scripts/translate_en_to_es.py"

permissions:
  contents: write

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Argos Translate
        run: |
          python -m pip install --upgrade pip
          python -m pip install argostranslate

      - name: Translate EN -> ES (Markdown + JSON)
        run: |
          python scripts/translate_en_to_es.py

      - name: Commit translated files (if changed)
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add es/models/darwin-vs-kropotkin/index.md models/darwin-vs-kropotkin/lab/i18n/es.json || true
            git commit -m "Auto-translate ES (generated) [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
